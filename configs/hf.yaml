# Profil "hf" : configuration de référence (modèles HuggingFace téléchargés au 1er lancement).
# Embeddings « passage » (E5) + FAISS + BM25 (hybride) + cross-encoder pour le re-ranking.
profile: hf
paths:
  raw_dir: data/raw
  processed_dir: data/processed
  index_dir: data/index
  log_dir: logs
chunking:
  max_words: 220        # taille cible d'un passage (≈ 300 tokens)
  overlap_words: 40     # recouvrement entre passages consécutifs (prose uniquement)
  min_words: 25         # les fragments plus courts sont fusionnés avec le voisin
embedding:
  backend: sentence-transformers
  model: intfloat/e5-small-v2
  query_prefix: "query: "        # E5 : préfixes obligatoires (embeddings asymétriques question/passage)
  passage_prefix: "passage: "
  batch_size: 32
retrieval:
  mode: hybrid          # dense | bm25 | hybrid
  k_dense: 30
  k_bm25: 30
  k_candidates: 20      # nombre de passages envoyés au re-ranker
  rrf_k: 60             # constante de Reciprocal Rank Fusion
rerank:
  backend: cross-encoder   # cross-encoder | feature | none
  model: cross-encoder/ms-marco-MiniLM-L-6-v2
  top_n: 4                 # passages conservés comme contexte du LLM
  max_length: 512
confidence:
  tau_high: 0.50           # ≥ : réponse confiante
  tau_low: 0.05            # < : « je ne sais pas » + escalade ; entre les deux : réponse avec réserve
  # → à recalibrer sur le jeu de dev : `python -m supportbot calibrate --profile hf`
llm:
  backend: extractive      # extractive (sans LLM) | openai (Ollama, OpenAI, Groq, vLLM…) | hf-local
  model: qwen2.5:3b-instruct
  base_url: http://localhost:11434/v1
  api_key_env: OPENAI_API_KEY
  hf_model: Qwen/Qwen2.5-1.5B-Instruct
  temperature: 0.1
  max_tokens: 700
  timeout_s: 120
history:
  max_turns: 3
logging:
  queries_file: queries.jsonl
  escalations_file: escalations.jsonl
